name: Android CI

# Two jobs:
#   check â€” unit tests + lint. Runs on everything, including pull requests. Gates the build.
#   build â€” assembles the APK, and publishes a GitHub Release on v* tags. Never runs for a PR, so
#           PR branches still don't produce APKs (the restriction added in ac33c65 is unchanged);
#           they only get the test/lint verdict.
on:
  push:
    branches: [ main ]
    tags: [ "v*", "5star-v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # required so tag builds can create a Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing was checking the unit tests or lint before, so both could rot silently while the APK
  # kept building. This job is the gate: if it is red, no APK is produced and no release is cut.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One variant, not `test`/`lint` across every flavor: standard+debug is the variant the JVM
      # tests are written against, and the ABI flavors differ only in the packaged native libs.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardGoatDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintStandardGoatDebug --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # PRs get the check job only â€” no APK, no release. Unchanged from ac33c65.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:

      # Set at runtime via $GITHUB_ENV in the "Name the APK" step. Declared here (empty) so static
      # linters don't flag the later ${{ env.APK_OUT }} references as "context access might be invalid".
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compute version (from the git tag on releases)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/5star-v* ]]; then
            NAME="${GITHUB_REF_NAME#5star-v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="99.99.99"
          fi
          if [[ "$GITHUB_REF" == refs/tags/5star-v* || "$GITHUB_REF" == refs/tags/v* ]]; then
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            CODE=999999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystores (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FIVESTAR_KEYSTORE_BASE64: ${{ secrets.FIVESTAR_KEYSTORE_BASE64 }}
        run: |
          # Runs on every push (not just tags) so dev builds are also signed RELEASE builds —
          # required since R8 was enabled: only assembleRelease exercises shrinking/keep rules.
          # Fork PRs have no secrets, so they fall back to a debug build below.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/goat.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/goat.keystore" >> "$GITHUB_ENV"
            echo "GoatTV signing configured."
          fi
          if [ -n "$FIVESTAR_KEYSTORE_BASE64" ]; then
            echo "$FIVESTAR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fivestar.keystore"
            echo "FIVESTAR_KEYSTORE_FILE=$RUNNER_TEMP/fivestar.keystore" >> "$GITHUB_ENV"
            echo "5Star signing configured."
          fi
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$FIVESTAR_KEYSTORE_BASE64" ]; then
            echo "No signing secrets set — building debug-signed APKs."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIVESTAR_KEYSTORE_PASSWORD: ${{ secrets.FIVESTAR_KEYSTORE_PASSWORD }}
          FIVESTAR_KEY_ALIAS: ${{ secrets.FIVESTAR_KEY_ALIAS }}
          FIVESTAR_KEY_PASSWORD: ${{ secrets.FIVESTAR_KEY_PASSWORD }}
          # Shared secret for the default metadata Worker's edge rule. Forks have no secret and
          # resolve "" â€” the app then falls back to the unprotected workers.dev base URL.
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
        run: |
          chmod +x ./gradlew
          
          # Determine brand flavor from tag
          if [[ "$GITHUB_REF" == refs/tags/5star-v* ]]; then
            BRAND="fivestar"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BRAND="goat"
          else
            BRAND="goat" # fallback for dev builds
          fi
          
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APKs for brand: $BRAND"
            # Build both ABIs for the selected brand
            ./gradlew "assembleStandard${BRAND^}Release" "assembleX86_64${BRAND^}Release" --stacktrace
            
            # Paths follow the (abi, brand) dimension order: standard + goat -> standardGoat
            ARM_SRC=$(ls app/build/outputs/apk/standard${BRAND^}/release/*.apk | head -n1)
            X86_SRC=$(ls app/build/outputs/apk/x86_64${BRAND^}/release/*.apk | head -n1)
            
            echo "Built arm:    $ARM_SRC"
            echo "Built x86_64: $X86_SRC"
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
            echo "X86_64_SRC=$X86_SRC" >> "$GITHUB_ENV"
          else
            echo "Building debug APK for brand: $BRAND"
            ./gradlew "assembleStandard${BRAND^}Debug"
            SRC=$(ls app/build/outputs/apk/standard${BRAND^}/debug/*.apk | head -n1)
            echo "Built: $SRC"
            echo "ARM_SRC=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/5star-v* ]]; then
            OUT="5Star-Ultra-v${{ steps.ver.outputs.name }}.apk"
            cp "$ARM_SRC" "dist/5Star-Ultra.apk"
            if [ -n "$X86_64_SRC" ]; then
              cp "$X86_64_SRC" "dist/5Star-Ultra-x86_64-v${{ steps.ver.outputs.name }}.apk"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            OUT="GoatTV-v${{ steps.ver.outputs.name }}.apk"
            cp "$ARM_SRC" "dist/GoatTV.apk"
            if [ -n "$X86_64_SRC" ]; then
              cp "$X86_64_SRC" "dist/GoatTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
            fi
          else
            OUT="app-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # Upload the whole dist/ so both the arm APK and the x86_64 APK are captured.
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG_APP.md
        if: startsWith(github.ref, 'refs/tags/5star-v') || startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The release body is what the in-app updater shows as "What's new", so it must be the
          # SHORT, bullet-only notes from CHANGELOG_APP.md â€” never CHANGELOG.md, which is the long
          # developer/contributor changelog and is read manually on GitHub.
          #
          # This runs here rather than only in release-notes.yml because a release published by
          # GITHUB_TOKEN does not trigger other workflows, so that job never fires for tag builds.
          # It stays as a fallback for releases published by hand from the GitHub UI.
          #
          # Take "## <tag>" up to the next "## v" header; the header may carry a date/"unreleased"
          # tail ("## v4.1.5 â€” 2026-07-26") or nothing at all, so match the version as a whole word.
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            # Trim leading/trailing blank lines.
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG_APP.md section for $TAG â€” publishing a placeholder body."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for details." \
              > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GoatTV GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GoatTV v${{ steps.ver.outputs.name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/GoatTV.apk
            dist/GoatTV-x86_64-v${{ steps.ver.outputs.name }}.apk
          body_path: dist/RELEASE_NOTES.md

      - name: Publish 5Star GitHub Release
        if: startsWith(github.ref, 'refs/tags/5star-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 5Star Ultra v${{ steps.ver.outputs.name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/5Star-Ultra.apk
            dist/5Star-Ultra-x86_64-v${{ steps.ver.outputs.name }}.apk
          body_path: dist/RELEASE_NOTES.md
